name: Cross-platform setup and integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify unchanged original notebook and only reviewed public CSV
        shell: python
        run: |
          import hashlib, pathlib, subprocess
          notebook = pathlib.Path("College_Majors_EDA_Colab.ipynb")
          expected = "418649971708968b7d999cfc9dc08fc09a9890f331c0ab32ac48829dfbdafe42"
          actual = hashlib.sha256(notebook.read_bytes()).hexdigest()
          assert actual == expected, f"Notebook modified: {actual}"
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          allowed_csv = {"data/split_ids.csv"}
          allowed_data = {"data/split_ids.csv", "data/README.md"}
          forbidden = [
              p for p in tracked
              if (p.lower().endswith((".csv", ".tsv", ".parquet", ".zip", ".pkl", ".joblib", ".key", ".pem")) and p not in allowed_csv)
              or (p.startswith("data/") and p not in allowed_data)
              or p.startswith((".venv/", ".env"))
          ]
          assert not forbidden, f"Disallowed tracked files: {forbidden}"
          assert "data/split_ids.csv" in tracked, "Missing published reference split"
          reference = pathlib.Path("data/split_ids.csv")
          split_hash = hashlib.sha256(reference.read_bytes()).hexdigest()
          assert split_hash == "e5215d887840ae25e0c953793842b1886670f51b879783904988a1348f7bfe6c", f"Split snapshot modified: {split_hash}"
          print("Notebook bytes, approved CSV reference and secret guard: PASS")
      - name: Install dependencies and run smoke tests (offline dataset mode)
        run: python setup.py --skip-data
